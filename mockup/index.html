<!DOCTYPE html>
<html lang="en">
<head>

  <title>Audio Normalizer · UI mock-up</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div class="app">

        </div>
      </div>
      <nav id="nav" aria-label="Main">
