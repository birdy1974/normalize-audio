<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Normalizer</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/brand/favicon-16.png">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <meta name="theme-color" content="#2f3130">
  <link rel="stylesheet" href="/static/styles.css?v=8">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand"><img class="logo" src="/static/brand/icon-192.png" alt="" aria-hidden="true"><span class="brand-text">Audio Normalizer</span></div>
        <div class="menu-tools">
          <button type="button" class="icon-btn" id="menu-collapse" aria-label="Collapse menu" title="Collapse menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button type="button" class="icon-btn" id="menu-pin" aria-pressed="true" aria-label="Pin menu" title="Pinned: menu stays as it is">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 3 3H7l3-3z"/><path d="M12 12v9"/></svg>
          </button>
        </div>
      </div>
      <nav id="nav" aria-label="Main">
        <a href="#/dashboard" data-route="dashboard" title="Dashboard"><span><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="nav-text">Dashboard</span></span></a>
        <a href="#/directories" data-route="directories" title="Directories"><span><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="nav-text">Directories</span></span></a>
        <a href="#/parked" data-route="parked" title="Parked files"><span><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><span class="nav-text">Parked files <span class="count-badge" id="parkedBadge">0</span></span></span></a>
        <a href="#/schedule" data-route="schedule" title="Schedule"><span><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="nav-text">Schedule</span></span></a>
        <a href="#/settings" data-route="settings" title="Settings"><span><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg><span class="nav-text">Settings</span></span></a>
        <a href="#/homeassistant" data-route="homeassistant" title="Home Assistant"><span><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="nav-text">Home Assistant</span></span></a>
      </nav>
      <div class="sidebar-activity" id="activity" title="What the app is doing now">
        <span class="dot activity-dot"></span>
        <span class="activity-text"><strong id="activity-main" role="status" aria-live="polite"></strong><span class="activity-sub" id="activity-sub" aria-live="off"></span></span>
      </div>
      <div class="sidebar-foot">Audio Normalizer · local network only</div>
    </aside>
    <main class="content">
      <div id="app" aria-live="polite"></div>
    </main>
  </div>
  <audio id="preview-audio" preload="metadata"></audio>
  <div class="player" id="player" role="region" hidden aria-label="Audio preview">
    <button type="button" class="player-btn" id="player-toggle" data-action="player-toggle" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <div class="player-body">
      <div class="player-head">
        <strong class="player-name" id="player-name"></strong>
        <span class="player-sub" id="player-sub"></span>
        <span class="player-time" id="player-time">0:00 / 0:00</span>
      </div>
      <input id="player-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position in the file">
    </div>
    <button type="button" class="player-btn" data-action="player-close" aria-label="Stop and close the player">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/audio-normalizer-card.js?v=5"></script>
  <script src="/static/app.js?v=8"></script>
</body>
</html>
