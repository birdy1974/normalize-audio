name: Docker image

# Builds the audio-normalizer image and publishes it to GitHub Container Registry (GHCR).
# Runs on pushes to main, to arena/** branches and to v* tags, and can be started by hand
# (workflow_dispatch works once this file is on the default branch).

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/audio-normalizer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests/

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally first so the image can be smoke-tested before anything is published.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: audio-normalizer:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          docker run -d --name smoke -p 8080:8080 \
            -v "$RUNNER_TEMP/config:/config" audio-normalizer:smoke
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then ok=1; echo; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "Health check failed. Container log:"
            docker logs smoke
            exit 1
          fi
          docker exec smoke sh -c 'ffmpeg -version | head -1'
          docker exec smoke sh -c 'command -v mp3gain || echo "mp3gain missing"'
          docker exec smoke sh -c 'command -v aacgain || echo "aacgain not installed (AAC/M4A gain disabled)"'
          docker rm -f smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
